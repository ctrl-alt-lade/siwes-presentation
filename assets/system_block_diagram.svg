<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#ffffff; font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Canvas Header -->
  <rect x="20" y="20" width="920" height="480" rx="16" fill="#fcfcfc" stroke="#e5e7eb" stroke-width="2"/>
  
  <text x="50" y="62" font-size="20" font-weight="700" fill="#111827" letter-spacing="-0.02em">CLOSED-LOOP PID CONTROL ARCHITECTURE</text>
  <text x="50" y="86" font-size="13" font-weight="500" fill="#6b7280">1-DOF Robotic Joint • Real-Time Feedback Loop &amp; Telemetry</text>
  
  <line x1="50" y1="105" x2="910" y2="105" stroke="#f3f4f6" stroke-width="2"/>

  <!-- Block 1: Input / Command Reference -->
  <g transform="translate(50, 160)" filter="url(#card-shadow)">
    <rect width="130" height="130" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="130" height="28" rx="12" fill="#111827"/>
    <rect x="0" y="16" width="130" height="12" fill="#111827"/>
    <text x="65" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">SETPOINT INPUT</text>
    
    <text x="65" y="55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">5x4 Matrix</text>
    <text x="65" y="73" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Keypad</text>
    <line x1="25" y1="84" x2="105" y2="84" stroke="#e5e7eb" stroke-width="1"/>
    <text x="65" y="100" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">Jog Calibration</text>
    <text x="65" y="115" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Angle Target r(t)</text>
  </g>

  <!-- Forward Path Arrow 1 -->
  <line x1="180" y1="225" x2="228" y2="225" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="204" y="215" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">r(t)</text>

  <!-- Summing Junction (Error calculation) -->
  <g transform="translate(230, 205)">
    <circle cx="20" cy="20" r="20" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#111827" stroke-width="2"/>
    <line x1="20" y1="10" x2="20" y2="30" stroke="#111827" stroke-width="2"/>
    <text x="6" y="15" font-size="13" font-weight="800" fill="#111827">+</text>
    <text x="26" y="36" font-size="14" font-weight="800" fill="#dc2626">−</text>
  </g>

  <!-- Forward Path Arrow 2 (Error e(t)) -->
  <line x1="270" y1="225" x2="318" y2="225" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="294" y="215" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">e(t)</text>

  <!-- Block 2: Controller (Arduino Uno) -->
  <g transform="translate(320, 160)" filter="url(#card-shadow)">
    <rect width="145" height="130" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="145" height="28" rx="12" fill="#111827"/>
    <rect x="0" y="16" width="145" height="12" fill="#111827"/>
    <text x="72.5" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">CONTROLLER</text>
    
    <text x="72.5" y="55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Arduino Uno</text>
    <text x="72.5" y="73" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">ATmega328P</text>
    <line x1="25" y1="84" x2="120" y2="84" stroke="#e5e7eb" stroke-width="1"/>
    <text x="72.5" y="100" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">PID Algorithm</text>
    <text x="72.5" y="115" font-size="9" font-weight="500" fill="#6b7280" text-anchor="middle">Kp • Ki • Kd Tuning</text>
  </g>

  <!-- Forward Path Arrow 3 (PWM / DIR) -->
  <line x1="465" y1="225" x2="518" y2="225" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="492" y="215" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">PWM / DIR</text>

  <!-- Block 3: Driver (L298N) -->
  <g transform="translate(520, 160)" filter="url(#card-shadow)">
    <rect width="140" height="130" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="28" rx="12" fill="#111827"/>
    <rect x="0" y="16" width="140" height="12" fill="#111827"/>
    <text x="70" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">MOTOR DRIVER</text>
    
    <text x="70" y="55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">L298N Driver</text>
    <text x="70" y="73" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">Dual H-Bridge</text>
    <line x1="25" y1="84" x2="115" y2="84" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="100" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">Opto-Isolated</text>
    <text x="70" y="115" font-size="9" font-weight="500" fill="#6b7280" text-anchor="middle">Back-EMF Snubber</text>
  </g>

  <!-- Forward Path Arrow 4 (12V High Current Power) -->
  <line x1="660" y1="225" x2="718" y2="225" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="689" y="215" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">12V Power</text>

  <!-- Block 4: Actuator / Plant (12V Motor & Joint) -->
  <g transform="translate(720, 160)" filter="url(#card-shadow)">
    <rect width="160" height="130" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="28" rx="12" fill="#111827"/>
    <rect x="0" y="16" width="160" height="12" fill="#111827"/>
    <text x="80" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">ACTUATOR &amp; JOINT</text>
    
    <text x="80" y="55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">12V DC Gearmotor</text>
    <text x="80" y="73" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">1-DOF Robotic Arm</text>
    <line x1="25" y1="84" x2="135" y2="84" stroke="#e5e7eb" stroke-width="1"/>
    <text x="80" y="100" font-size="10" font-weight="600" fill="#4b5563" text-anchor="middle">Composite Hub</text>
    <text x="80" y="115" font-size="9" font-weight="500" fill="#6b7280" text-anchor="middle">Angular Pos θ(t)</text>
  </g>

  <!-- Output Arrow to Space -->
  <line x1="880" y1="225" x2="925" y2="225" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="902" y="215" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">θ(t)</text>

  <!-- Feedback Path (Down, Left, Up to Summing Junction) -->
  <path d="M 800 290 L 800 395 L 250 395 L 250 248" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-feedback)"/>

  <!-- Block 5: Feedback Sensor (Hall Effect Encoder) in bottom center -->
  <g transform="translate(450, 345)" filter="url(#card-shadow)">
    <rect width="220" height="95" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="26" rx="12" fill="#2563eb"/>
    <rect x="0" y="14" width="220" height="12" fill="#2563eb"/>
    <text x="110" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">FEEDBACK TRANSDUCER</text>
    
    <text x="110" y="47" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Hall Effect Encoder</text>
    <text x="110" y="65" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">2.75 Pulses / Degree</text>
    <text x="110" y="81" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Real-time Telemetry y(t)</text>
  </g>

  <!-- Feedback label -->
  <text x="350" y="385" font-size="11" font-weight="700" fill="#2563eb">Measured Angle y(t)</text>

  <!-- Footer badges -->
  <g transform="translate(50, 465)">
    <rect x="0" y="0" width="170" height="22" rx="4" fill="#f3f4f6"/>
    <text x="85" y="15" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">CALIBRATION: JOG MODE</text>

    <rect x="185" y="0" width="210" height="22" rx="4" fill="#f3f4f6"/>
    <text x="290" y="15" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">CONTROLLER: ARDUINO PID LIB</text>

    <rect x="410" y="0" width="200" height="22" rx="4" fill="#f3f4f6"/>
    <text x="510" y="15" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">SAMPLING INTERVAL: Δt = 10ms</text>
  </g>
</svg>
